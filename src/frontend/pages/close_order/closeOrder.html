<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Fechar Comanda</title>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header Fixo -->
  <header class="main-header">
    <button class="icon-btn" aria-label="Menu de navegação" id="menuBtn">
      <span class="material-symbols-outlined">menu</span>
      <span class="header-title">Comanda</span>
    </button>

    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-actions" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="page-wrapper">
    <!-- Summary Section -->
    <section class="summary-section card" aria-label="Resumo da comanda">
      <h1 class="page-title">Comanda da Mesa <span id="table-number">?</span></h1>

      <!-- Large Red X Box -->
      <div class="close-icon-container">
        <div class="close-box">
          <span class="close-symbol" id="display-table-number">?</span>
        </div>
      </div>
    </section>

    <!-- Consumido Section -->
    <section class="consumed-section" aria-label="Itens consumidos">
      <div class="section-header">
        <h2 class="section-title">Consumido <span class="material-symbols-outlined arrow-icon">arrow_forward</span></h2>
      </div>

      <div class="consumed-list" id="consumed-list">
        <!-- Items will be inserted dynamically -->
      </div>
    </section>

    <!-- Totals Section -->
    <section class="totals-section card" aria-label="Resumo de valores">
      <div class="total-row">
        <span class="total-label">Subtotal:</span>
        <span class="total-value" id="subtotal">R$ 0,00</span>
      </div>
      <div class="total-row">
        <span class="total-label">Gorjeta (10%):</span>
        <span class="total-value" id="tip-value">R$ 0,00</span>
      </div>
      <div class="total-row total-final">
        <span class="total-label">Total:</span>
        <span class="total-value" id="total-final">R$ 0,00</span>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="actions-section" aria-label="Ações">
      <div class="actions-container">
        <button class="btn btn-secondary" id="btn-back">Voltar</button>
        <button class="btn btn-primary" id="btn-close-order">Fechar Comanda</button>
      </div>
    </section>
  </main>
</body>

</html>
