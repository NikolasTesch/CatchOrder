<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Fechar Comanda</title>
  <link rel='icon' href='/img/icon.svg' type='image/svg+xml'>
 
  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header Fixo -->
  <header class="main-header">
    <button class="icon-btn" aria-label="Menu de navegação" id="menuBtn">
      <span class="material-symbols-outlined">menu</span>
      <span class="header-title">Comanda</span>
    </button>

    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-actions" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="page-wrapper center-content">

    <!-- Table Badge -->
    <div class="table-badge-container">
      <div class="table-badge">
        Mesa <span id="display-table-number">--</span>
      </div>
    </div>

    <!-- Bill Card -->
    <div class="bill-card" aria-label="Detalhes da conta">
      <!-- Card Header -->
      <div class="bill-header">
        <h2 class="bill-title">Itens consumidos</h2>
      </div>

      <!-- Card Body (List) -->
      <div class="bill-body" id="consumed-list">
        <!-- Items will be inserted dynamically here -->
        <!-- Example Structure for TS generation:
        <div class="bill-row">
          <span class="bill-item-name">1x Beer</span>
          <span class="bill-item-price">R$ 9,00</span>
        </div>
        <div class="bill-divider"></div>
        -->
      </div>

      <!-- Card Footer (Totals) -->
      <div class="bill-footer">
        <div class="bill-total-row">
          <span class="total-label-sm">Subtotal:</span>
          <span class="total-value-sm" id="subtotal">R$ 0,00</span>
        </div>

        <div class="bill-total-row">
          <label class="total-label-sm checkbox-label">
            <input type="checkbox" id="tip-toggle" checked>
            Taxa de serviço (10%):
          </label>
          <span class="total-value-sm" id="tip-value">R$ 0,00</span>
        </div>

        <div class="bill-total-row final-total">
          <span class="total-label-lg">Total:</span>
          <span class="total-value-lg" id="total-final">R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Details/Observations (Hidden by default) -->
    <section id="observations-section" style="display: none; margin-top: 1rem; padding: 0 1rem;">
      <p class="observations-text" id="observations-text"></p>
    </section>

    <!-- Actions -->
    <div class="bill-actions">
      <button class="btn btn-dark-grey" id="btn-back">Voltar</button>
      <button class="btn btn-teal" id="btn-close-order">Fechar conta</button>
    </div>

  </main>
  <style>
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
    }
  </style>
</body>

</html>
