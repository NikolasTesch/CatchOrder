<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Comissões</title>
  <link rel='icon' href='../img/icon.svg' type='image/svg+xml'>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <div class="bg-ambient-container">
    <div class="neon-blob blob-1"></div>
    <div class="neon-blob blob-2"></div>
    <div class="neon-blob blob-3"></div>
  </div>

  <header class="main-header glass">
    <div class="header-left">
      <button class="icon-btn" onclick="window.history.back()" aria-label="Voltar">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <h1 class="page-title">Comissões da Equipe</h1>
    </div>

    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder" class="logo-image">
    </div>

    <div class="header-right">
      <button class="icon-btn" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
    </div>
  </header>

  <div class="app-layout single-column">
    <main class="main-content">
      <div id="loadingMessage" class="loading-container">
        <p>Carregando garçons...</p>
      </div>

      <div id="waiters-grid" class="waiters-grid" style="display: none;">
        <!-- Filled by JS -->
      </div>
    </main>
  </div>

  <!-- Commission Details Modal -->
  <div class="modal-overlay" id="commissionModal">
    <div class="modal-content glass">
      <div class="modal-header">
        <h3 id="modalWaiterName">Detalhes do Garçom</h3>
        <button class="icon-btn-small" id="closeCommissionModal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      
      <div class="modal-body">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID Pedido</th>
                <th>Data</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="commissionTableBody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="modal-footer">
        <span class="total-label">Total de Vendas:</span>
        <span class="total-value" id="modalTotalSales">R$ 0,00</span>
      </div>
    </div>
  </div>

  <script src="commissions.ts"></script>
</body>
</html>
