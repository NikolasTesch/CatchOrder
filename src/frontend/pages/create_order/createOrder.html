<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Criação de Pedidos</title>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" aria-label="Voltar" id="headerBackBtn">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
    </div>

    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-actions" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
      <button class="icon-btn-small" aria-label="Sair" id="logoutBtn">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </nav>
  </header>



  <!-- Main Content -->
  <main class="content-wrapper">
    <div class="create-order-layout">
      <!-- Left Column: Products -->
      <section class="products-area">
        <!-- Breadcrumb / Header in Content if needed, otherwise just products -->
        <div class="page-header-inline">
          <span class="breadcrumb">Pedidos / <b>Novo Pedido</b></span>
        </div>

        <!-- Container para Produtos Dinâmicos -->
        <div id="products-container"></div>
      </section>

      <!-- Right Column: Order Summary Sidebar -->
      <aside class="order-sidebar">
        <div class="order-summary-card">
          <div class="order-card-header">
            <h3>Resumo do Pedido</h3>
            <span class="material-symbols-outlined toggle-icon">expand_less</span>
          </div>

          <div class="order-card-body">
            <!-- Table Info -->
            <div class="table-info-display">
              <h4 id="table-name-display">Mesa --</h4>
            </div>

            <!-- Items List Container (Existing + New) -->
            <div id="order-items-list" class="items-list-container">
              <!-- TS will inject items here -->
            </div>

            <!-- Observations -->
            <div class="observations-wrapper">
              <label class="obs-label">Observações (Obs.)</label>
              <textarea class="obs-textarea" rows="4" placeholder="Digite suas observações..."
                aria-label="Campo de observações do pedido"></textarea>
            </div>
          </div>

          <!-- Footer with Totals and Actions -->
          <div class="order-card-footer">
            <div class="summary-row subtotal">
              <span>Subtotal:</span>
              <span id="summary-subtotal">R$ 0.00</span>
            </div>
            <div class="summary-row total">
              <span>Total:</span>
              <span id="summary-total">R$ 0.00</span>
            </div>

            <!-- Botão Salvar/Enviar (Primary Action) -->
            <button class="btn btn-primary btn-full btn-lg btn-send" style="background-color: #10b981;">Criar
              Pedido</button>

            <!-- Botão Finalizar (Conditional) -->
            <button class="btn btn-full btn-lg btn-finalize"
              style="background-color: #ef4444; color: white; border: none; display: none; margin-top: 0.5rem;">Finalizar
              Pedido</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- User Modal -->
  <div class="user-modal" id="userModal">
    <div class="user-modal-overlay" id="userModalOverlay"></div>
    <div class="user-modal-content">
      <div class="user-modal-header">
        <h3>Meu Perfil</h3>
        <button class="close-btn" id="closeUserModal" aria-label="Fechar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="user-modal-body">
        <div class="user-avatar">
          <span class="material-symbols-outlined">account_circle</span>
        </div>
        <div class="user-info-modal">
          <p class="user-name" id="modalUserName">Carregando...</p>
          <p class="user-role" id="modalUserRole">Carregando...</p>
        </div>
      </div>
      <div class="user-modal-footer">
        <button class="btn btn-danger btn-full" id="logoutBtn">
          <span class="material-symbols-outlined">logout</span>
          Sair
        </button>
      </div>
    </div>
  </div>

  <!-- Script injected by Webpack -->
</body>

</html>
