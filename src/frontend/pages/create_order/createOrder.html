<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Criação de Pedidos</title>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" aria-label="Menu" id="menuBtn">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <h1 class="page-title">Pedidos</h1>
    </div>

    <div class="header-center">
      <img src="/img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-right" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="content-wrapper">
    <!-- Barra de Informações -->
    <section class="info-bar card" aria-label="Informações do pedido">
      <div class="info-item">
        <span class="info-label">Qtd Produtos</span>
      </div>
      <div class="info-item">
        <span class="info-label">Total: R$00,00</span>
      </div>
    </section>

    <!-- Container para Produtos Dinâmicos -->
    <div id="products-container"></div>

    <!-- Seção de Observações -->
    <section class="observations-section card">
      <h3 class="obs-title">Obs.</h3>
      <p class="obs-subtitle">Adicione as observações do pedido aqui.</p>

      <textarea class="obs-textarea input" rows="3" placeholder="Digite suas observações..."
        aria-label="Campo de observações do pedido"></textarea>
    </section>

    <!-- Botões de Ação -->
    <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
      <!-- Botão Salvar/Enviar (Primary Action for Items) -->
      <button class="btn btn-primary btn-full btn-lg btn-send" style="background-color: #10b981;">Salvar / Atualizar
        Itens</button>

      <!-- Botão Finalizar (Close Table) -->
      <button class="btn btn-full btn-lg btn-finalize"
        style="background-color: #ef4444; color: white; border: none;">Finalizar Pedido</button>
    </div>
  </main>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar-content">
      <div class="sidebar-header">
        <h2>Menu</h2>
        <button class="close-btn" id="closeSidebar" aria-label="Fechar menu">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <ul class="sidebar-menu">
        <li><a href="../products/products.html">
          <span class="material-symbols-outlined">restaurant_menu</span>
          Produtos
        </a></li>
        <li><a href="../create_products/createProducts.html">
          <span class="material-symbols-outlined">add_circle</span>
          Adicionar Produto
        </a></li>
        <li><a href="../users/users.html">
          <span class="material-symbols-outlined">group</span>
          Usuários
        </a></li>
        <li><a href="../waiter_main/waiterMain.html">
          <span class="material-symbols-outlined">table_restaurant</span>
          Mesas
        </a></li>
        <li><a href="../orders/orders.html">
          <span class="material-symbols-outlined">receipt_long</span>
          Pedidos
        </a></li>
      </ul>
    </nav>
  </aside>

  <!-- User Modal -->
  <div class="user-modal" id="userModal">
    <div class="user-modal-overlay" id="userModalOverlay"></div>
    <div class="user-modal-content">
      <div class="user-modal-header">
        <h3>Meu Perfil</h3>
        <button class="close-btn" id="closeUserModal" aria-label="Fechar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="user-modal-body">
        <div class="user-avatar">
          <span class="material-symbols-outlined">account_circle</span>
        </div>
        <div class="user-info-modal">
          <p class="user-name" id="modalUserName">Carregando...</p>
          <p class="user-role" id="modalUserRole">Carregando...</p>
        </div>
      </div>
      <div class="user-modal-footer">
        <button class="btn btn-danger btn-full" id="logoutBtn">
          <span class="material-symbols-outlined">logout</span>
          Sair
        </button>
      </div>
    </div>
  </div>

  <!-- Script injected by Webpack -->
</body>

</html>
