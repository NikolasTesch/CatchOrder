<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Novo Produto</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn">
        <span class="material-symbols-outlined">arrow_back_ios</span>
      </button>
      <h1 class="page-title">Novo produto</h1>
    </div>
    <button class="btn-ai">
      <span class="material-symbols-outlined ai-icon">auto_awesome</span>
      Criar com IA
    </button>
  </header>

  <!-- Tabs -->
  <div class="tabs-container">
    <div class="tab active">CADASTRO</div>
    <div class="tab">ESTOQUE</div>
  </div>

  <!-- Main Content -->
  <div class="content-wrapper">

    <!-- Product Preview Section -->
    <div class="product-preview-section">
      <div class="color-picker-placeholder"></div>

      <div class="product-card-preview">
        <div class="card-image-area">
          <span class="preview-text">Nome</span>
        </div>
        <div class="card-info-area">
          <span class="info-name">Nome do prod...</span>
          <span class="info-price">R$ 0,00</span>
        </div>
      </div>

      <button class="icon-btn gallery-btn">
        <span class="material-symbols-outlined">image</span>
      </button>
    </div>

    <!-- Form Inputs -->
    <div class="form-container">
      <div class="input-group">
        <input type="text" placeholder="Nome do Produto" class="form-input">
      </div>

      <div class="input-group">
        <input type="text" placeholder="Preço de Venda" class="form-input">
      </div>
    </div>

    <!-- Optionals Section -->
    <div class="section-container">
      <div class="section-header-row">
        <h3 class="section-title">Opcionais</h3>
        <span class="material-symbols-outlined chevron">expand_more</span>
      </div>
      <p class="section-subtitle">Experimente a descrição gerada com IA</p>
    </div>

    <!-- Variants Section -->
    <div class="section-container variants-section">
      <div class="section-header-row">
        <div class="title-badge-group">
          <h3 class="section-title">Variantes</h3>
          <span class="badge-new">NOVO</span>
        </div>
        <button class="btn-text-action">ADICIONAR</button>
      </div>
    </div>

  </div>

  <!-- Footer Action -->
  <div class="footer-action">
    <button class="btn-submit">Adicionar produto</button>
  </div>

</body>

</html>
