<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Adicionar Usuário</title>
  
  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <button class="icon-btn" aria-label="Voltar" id="backBtn">
      <span class="material-symbols-outlined">arrow_back</span>
      <span class="header-title">Adicionar Usuário</span>
    </button>

    <div class="header-center">
      <img src="/img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-actions" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="page-wrapper">
    <section class="user-form-section" aria-label="Formulário de cadastro de usuário">
      <div class="photo-upload">
        <button type="button" class="photo-circle" aria-label="Enviar foto do usuário" id="photoUploadBtn">
          <span class="material-symbols-outlined camera-icon">photo_camera</span>
        </button>
      </div>

      <form class="user-form" id="userForm">
        <div class="form-group">
          <label for="full-name">Nome Completo</label>
          <input type="text" id="full-name" placeholder="Nome Completo" class="input-field" required aria-label="Nome completo">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="******************" class="input-field" required aria-label="Senha">
        </div>

        <div class="form-group">
          <label for="role">Cargo</label>
          <input type="text" id="role" placeholder="Cargo" class="input-field" required aria-label="Cargo">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Salvar</button>
      </form>
    </section>
  </main>

  <script src="createUser.js"></script>
</body>

</html>
