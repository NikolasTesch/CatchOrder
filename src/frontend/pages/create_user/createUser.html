<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Adicionar Usuário</title>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <button class="icon-btn" aria-label="Voltar" id="backBtn">
      <span class="material-symbols-outlined">arrow_back</span>
      <span class="header-title">Adicionar Usuário</span>
    </button>

    <div class="header-center">
      <img src="/img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-actions" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="page-wrapper">
    <section class="user-form-section" aria-label="Formulário de cadastro de usuário">
      <div class="photo-upload">
        <button type="button" class="photo-circle" aria-label="Enviar foto do usuário" id="photoUploadBtn">
          <span class="material-symbols-outlined camera-icon">photo_camera</span>
        </button>
      </div>

      <form class="user-form" id="userForm" novalidate>
        <div class="form-group">
          <label for="full-name">Nome Completo</label>
          <input type="text" id="full-name" placeholder="Nome Completo" class="input-field" aria-label="Nome completo">
          <span class="error-message" id="full-name-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Telefone</label>
          <div class="phone-input-wrapper">
            <span class="phone-icon material-symbols-outlined">flag</span>
            <input type="tel" id="phone" placeholder="+55 (00) 00000-0000" class="input-field phone-input"
              aria-label="Telefone">
          </div>
          <span class="error-message" id="phone-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Username</label>
          <input type="text" id="email" placeholder="Username (min 4 chars)" class="input-field" aria-label="Username">
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="******************" class="input-field" aria-label="Senha">
          <span class="error-message" id="password-error"></span>
        </div>

        <div class="form-group">
          <label for="role">Cargo</label>
          <select id="role" class="input-field" aria-label="Cargo">
            <option value="" disabled selected>Selecione um cargo</option>
            <option value="admin">Administrador</option>
            <option value="manager">Gerente</option>
            <option value="waiter">Garçom</option>
            <option value="kitchen">Cozinha</option>
          </select>
          <span class="error-message" id="role-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Salvar</button>
      </form>
    </section>
  </main>
</body>

</html>
