<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catchorder - Recuperar Senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

</head>

<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="logo-box">
        <span class="material-symbols-outlined icon-main">restaurant_menu</span>
      </div>
      <h2 class="brand-name">Catchorder</h2>
      <p class="subtitle">Recupere o acesso à sua conta</p>
    </header>

    <main class="card">
      <h1 class="card-title">Recuperar Senha</h1>

      <p class="instruction-text"
        style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.875rem;">
        Digite seu e-mail abaixo e enviaremos as instruções para redefinir sua senha.
      </p>

      <div class="form-group">
        <label for="email">E-mail Profissional</label>
        <input type="email" id="email" placeholder="seu@email.com" class="input-field">
      </div>

      <button class="btn btn-primary">Enviar Instruções</button>

      <div class="switch-prompt">
        Lembrou sua senha? <a href="../landing_page/landingPage.html">Voltar para Login</a>
      </div>
    </main>

    <footer class="footer">
      <p>
        <a href="#" class="link-bold">Precisa de ajuda?</a>
      </p>
    </footer>
  </div>
</body>

</html>
