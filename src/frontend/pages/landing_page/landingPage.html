<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catchorder - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../../../../public/css/global.css">
</head>

<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="logo-box">
        <span class="material-symbols-outlined icon-main">restaurant_menu</span>
      </div>
      <h2 class="brand-name">Catchorder</h2>
      <p class="subtitle">Sistema de Gestão de Restaurantes</p>
    </header>

    <main class="card">
      <h1 class="card-title">Bem-vindo ao Catchorder</h1>

      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" placeholder="Digite seu nome de usuário" class="input-field">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-password-wrapper">
          <input type="password" id="password" placeholder="Digite a sua senha" class="input-field password-input">
          <div class="password-toggle">
            <span class="material-symbols-outlined">visibility</span>
          </div>
        </div>
        <div class="forgot-password">
          <a href="#">Esqueci minha senha</a>
        </div>
      </div>

      <div id="login-error" class="error-message"></div>
      <button class="btn btn-primary">Continuar</button>

      <div class="signup-prompt">
        Não tem uma conta? <a href="../register/register.html">Cadastre-se agora</a>
      </div>

    </main>

    <footer class="footer">
      <p>Ao continuar, você concorda com os
        <a href="#" class="link-bold">Termos de Serviço</a> e
        <a href="#" class="link-bold">Política de Privacidade</a>.
      </p>
    </footer>
  </div>
  <script src="landingPage.js"></script>
</body>

</html>
