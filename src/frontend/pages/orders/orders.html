<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Pedidos</title>
  <link rel='icon' href='/img/icon.svg' type='image/svg+xml'>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" onclick="history.back()" aria-label="Voltar">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu de navegação">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="header-title">Pedidos</span>
    </div>

    <!-- Centro: Logo -->
    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder Logo" class="logo-image">
    </div>

    <!-- Direita: Ações -->
    <nav class="header-actions">
      <button class="icon-btn-small" id="darkModeToggle" aria-label="Alternar modo escuro">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" id="userBtn" aria-label="Perfil do usuário">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
      <button class="icon-btn-small" id="logoutBtn" aria-label="Sair">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </nav>
  </header>

  <!-- Sidebar de Navegação -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <button class="nav-item" data-href="waiterMain.html">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="nav-text">Dashboard</span>
      </button>
      <button class="nav-item active" data-href="orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="nav-text">Pedidos</span>
      </button>
    </nav>
  </aside>

  <main class="page-wrapper">
    <!-- Barra de Busca -->
    <div class="search-container" role="search" aria-label="Buscar pedidos por mesa">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Buscar mesa" aria-label="Número da mesa">
    </div>

    <!-- Botão Novo Pedido -->
    <button class="btn-new-order" aria-label="Criar novo pedido">Novo Pedido</button>

    <!-- Seção: Ordens Abertas -->
    <section class="orders-section" aria-label="Ordens em aberto">
      <h2 class="section-title">Ordens abertas</h2>
      <div class="orders-grid" id="open-orders-grid">
        <!-- Cards serão injetados aqui via TypeScript -->
      </div>
    </section>

    <!-- Seção: Ordens Finalizadas -->
    <section class="orders-section" aria-label="Ordens finalizadas">
      <h2 class="section-title">Ordens finalizadas</h2>
      <div class="orders-grid" id="finished-orders-grid">
        <!-- Cards serão injetados aqui via TypeScript -->
      </div>
    </section>
  </main>
</body>

</html>
