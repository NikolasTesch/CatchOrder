<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Pagamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../../../../public/css/global.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Top Bar with Menu Icon -->
  <div class="top-nav">
    <button class="icon-btn">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>

  <!-- Main Price Header -->
  <header class="price-header">
    <h1 class="total-price">R$53,00</h1>
  </header>

  <div class="page-wrapper">

    <!-- Consumido Section -->
    <section class="consumed-card">
      <div class="section-header">
        <h2 class="section-title">Consumido <span class="material-symbols-outlined arrow-icon">arrow_forward</span></h2>
      </div>

      <div class="consumed-list">
        <!-- Item 1 -->
        <div class="consumed-item">
          <div class="item-header">
            <span class="item-price">R$20,00</span>
          </div>
          <div class="item-details">
            <span class="item-name">Prato feito - Lasanha de frango</span>
          </div>
          <div class="item-divider"></div>
        </div>

        <!-- Item 2 -->
        <div class="consumed-item">
          <div class="item-header">
            <span class="item-price">R$21,00</span>
          </div>
          <div class="item-details">
            <span class="item-name">Prato feito - Alcatra com fritas</span>
          </div>
          <div class="item-divider"></div>
        </div>

        <!-- Item 3 -->
        <div class="consumed-item">
          <div class="item-header">
            <span class="item-price">R$12,00</span>
          </div>
          <div class="item-details">
            <span class="item-name">Coca-Cola 2 Litros</span>
          </div>
          <div class="item-divider"></div>
        </div>
      </div>
    </section>

    <!-- Payment Methods -->
    <div class="payment-methods-container">
      <button class="payment-btn active">
        <span class="material-symbols-outlined">credit_card</span>
      </button>
      <button class="payment-btn">
        <span class="material-symbols-outlined">payments</span>
      </button>
      <button class="payment-btn">
        <div class="pix-icon-container">
          <span class="material-symbols-outlined">qr_code_2</span>
          <!-- Using QR code as visual proxy for Pix if no SVG available, or text "Pix" -->
          <span class="pix-text">pix</span>
        </div>
      </button>
    </div>

  </div>

  <!-- Footer Logo -->
  <footer class="main-footer">
    <div class="logo-container">
      <span class="logo-text">CatchOrder</span>
    </div>
  </footer>

</body>

</html>
