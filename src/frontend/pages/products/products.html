<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Produtos</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <h1 class="page-title">Produtos</h1>
    </div>

    <div class="header-center">
      <span class="brand-text">CatchOrder</span>
    </div>

    <div class="header-right">
      <div class="user-avatar"></div>
    </div>
  </header>

  <div class="content-wrapper">
    <!-- Search Bar -->
    <div class="search-container">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Buscar">
    </div>

    <!-- Action Button -->
    <div class="actions-container">
      <button class="btn-add-product">Adicionar Produto</button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid">

      <!-- Product Card 1 -->
      <div class="product-card">
        <div class="card-image"></div>
        <div class="card-info">
          <h3 class="product-name">NomeProduto</h3>
          <span class="product-category">Categoria</span>
          <span class="product-price">R$00,00</span>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="product-card">
        <div class="card-image"></div>
        <div class="card-info">
          <h3 class="product-name">NomeProduto</h3>
          <span class="product-category">Categoria</span>
          <span class="product-price">R$00,00</span>
        </div>
      </div>

      <!-- Add New Placeholder Card -->
      <div class="product-card add-card">
        <span class="material-symbols-outlined add-icon">add</span>
      </div>

      <!-- More Placeholders to fill grid like image -->
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>

    </div>
  </div>

</body>

</html>
