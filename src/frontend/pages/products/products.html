<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Produtos</title>
  
  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" aria-label="Menu" id="menuBtn">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <h1 class="page-title">Produtos</h1>
    </div>

    <div class="header-center">
      <img src="/img/logoName.svg" alt="CatchOrder Logo" class="logo-image" id="logoImage">
    </div>

    <nav class="header-right" aria-label="Ações do cabeçalho">
      <button class="icon-btn-small" aria-label="Alternar modo escuro" id="darkModeToggle">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" aria-label="Acessar perfil do usuário" id="userBtn">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="content-wrapper">
    <!-- Search Bar -->
    <div class="search-container">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Buscar" id="searchInput" aria-label="Buscar produtos">
    </div>

    <!-- Action Button -->
    <div class="actions-container">
      <button class="btn btn-primary btn-full" id="addProductBtn">Adicionar Produto</button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">

      <!-- Product Card 1 -->
      <div class="product-card">
        <div class="card-image"></div>
        <div class="card-info">
          <h3 class="product-name">NomeProduto</h3>
          <span class="product-category">Categoria</span>
          <span class="product-price">R$00,00</span>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="product-card">
        <div class="card-image"></div>
        <div class="card-info">
          <h3 class="product-name">NomeProduto</h3>
          <span class="product-category">Categoria</span>
          <span class="product-price">R$00,00</span>
        </div>
      </div>

      <!-- Add New Placeholder Card -->
      <button class="product-card add-card" aria-label="Adicionar novo produto" id="addCardBtn">
        <span class="material-symbols-outlined add-icon">add</span>
      </button>

      <!-- More Placeholders to fill grid like image -->
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>
      <div class="product-card placeholder-only"></div>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
