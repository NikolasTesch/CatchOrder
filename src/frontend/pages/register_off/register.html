<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catchorder - Criar Conta</title>
  <link rel='icon' href='/img/icon.svg' type='image/svg+xml'>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">

</head>

<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="logo-box">
        <span class="material-symbols-outlined icon-main">restaurant_menu</span>
      </div>
      <h2 class="brand-name">Catchorder</h2>
      <p class="subtitle">Comece a transformar sua gestão hoje</p>
    </header>

    <main class="card">
      <h1 class="card-title">Crie sua conta</h1>

      <div class="form-group">
        <label for="name">Seu Nome</label>
        <input type="text" id="name" placeholder="Como podemos te chamar?" class="input-field">
      </div>

      <div class="form-group">
        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" placeholder="Crie seu usuário de acesso" class="input-field">
      </div>

      <div class="form-group">
        <label for="role">Cargo</label>
        <div class="select-wrapper">
          <select id="role" class="input-field">
            <option value="" disabled selected>Selecione seu cargo</option>
            <option value="manager">Gerente</option>
            <option value="waiter">Garçom</option>
            <option value="kitchen">Cozinha</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Criar Senha</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" class="input-field">
      </div>

      <div id="register-error" class="error-message"></div>

      <button class="btn btn-primary">Finalizar Cadastro</button>

      <div class="switch-prompt">
        Já tem uma conta? <a href="../landing_page/landingPage.html">Fazer login</a>
      </div>
    </main>

    <footer class="footer">
      <p>Ao se cadastrar, você aceita nossos
        <a href="#" class="link-bold">Termos de Uso</a>.
      </p>
    </footer>
  </div>
</body>

</html>
