<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Usuários</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Header Fixo -->
  <header class="main-header">
    <button class="icon-btn">
      <span class="material-symbols-outlined">menu</span>
      <span class="header-title">Usuários</span>
    </button>

    <div class="header-actions">
      <button class="icon-btn-round">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <button class="icon-btn-round">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </div>
  </header>

  <div class="page-wrapper">
    <!-- Barra de Busca -->
    <div class="search-container">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="Buscar">
      <button class="add-btn">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>

    <!-- Lista de Usuários -->
    <div class="users-list">
      <!-- Card de Usuário -->
      <div class="user-card">
        <div class="user-avatar"></div>
        <div class="user-info">
          <h3 class="user-name">Colaborador Fulano (cargo)</h3>
          <p class="user-email">Emaildecadastro@doFulano.com</p>
        </div>
        <button class="btn-config">
          Configurar
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <!-- Card de Usuário -->
      <div class="user-card">
        <div class="user-avatar"></div>
        <div class="user-info">
          <h3 class="user-name">Colaborador Cicrano (cargo)</h3>
          <p class="user-email">Emaildecadastro@doCicrano.com</p>
        </div>
        <button class="btn-config">
          Configurar
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <!-- Card de Usuário -->
      <div class="user-card">
        <div class="user-avatar"></div>
        <div class="user-info">
          <h3 class="user-name">Colaborador Beltrano (cargo)</h3>
          <p class="user-email">Emaildecadastro@doBeltrano.com</p>
        </div>
        <button class="btn-config">
          Configurar
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <!-- Card de Usuário -->
      <div class="user-card">
        <div class="user-avatar"></div>
        <div class="user-info">
          <h3 class="user-name">Colaborador Sicrano (cargo)</h3>
          <p class="user-email">Emaildecadastro@doSicrano.com</p>
        </div>
        <button class="btn-config">
          Configurar
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
