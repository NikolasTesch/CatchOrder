<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatchOrder - Garçom</title>

    <!-- Noto Sans JP Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body>
    <!-- Sidebar de Navegação -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Menu</h2>
        <button class="sidebar-close" id="sidebarClose">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/waiterMain.html" class="nav-item active">
          <span class="material-symbols-outlined">home</span>
          <span class="nav-text">Início</span>
        </a>
        <a href="/pages/orders.html" class="nav-item">
          <span class="material-symbols-outlined">receipt_long</span>
          <span class="nav-text">Pedidos</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-logout" id="sidebarLogout">
          <span class="material-symbols-outlined">logout</span>
          <span>Finalizar sessão</span>
        </button>
      </div>
    </aside>

    <!-- User Dropdown -->
    <div class="user-dropdown" id="userDropdown">
      <div class="user-dropdown-header">
        <span class="material-symbols-outlined user-avatar"
          >account_circle</span
        >
        <div class="user-info">
          <span class="user-name" id="userName">Carregando...</span>
          <span class="user-role" id="userRole">Garçom</span>
        </div>
      </div>
      <div class="user-dropdown-divider"></div>
      <button class="user-dropdown-item" id="logoutBtn">
        <span class="material-symbols-outlined">logout</span>
        <span>Sair</span>
      </button>
    </div>

    <!-- Cabeçalho Principal -->
    <header class="main-header">
      <button class="icon-btn" aria-label="Menu" id="menuBtn">
        <span class="material-symbols-outlined">menu</span>
      </button>

      <div class="header-center">
        <img
          src="/img/logoName.svg"
          alt="CatchOrder Logo"
          class="logo-image"
          id="logoImage"
        />
      </div>

      <nav class="header-actions" aria-label="Ações do cabeçalho">
        <button
          class="icon-btn-small"
          aria-label="Alternar modo escuro"
          id="darkModeToggle"
        >
          <span class="material-symbols-outlined">light_mode</span>
        </button>
        <button
          class="icon-btn-small"
          aria-label="Acessar perfil do usuário"
          id="userBtn"
        >
          <span class="material-symbols-outlined">account_circle</span>
        </button>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="page-wrapper">
      <!-- Card de Resumo do Dia -->
      <section class="summary-card" aria-label="Resumo do dia">
        <p class="summary-title">HOJE</p>
        <h2 class="summary-value">R$00,00</h2>
        <p class="summary-subtitle">x mesas atendidas hoje</p>
        <button class="btn btn-primary btn-full" id="newOrderBtn">
          Novo Pedido
        </button>
      </section>

      <!-- Seção: Mesas Ocupadas -->
      <section class="tables-section" aria-label="Mesas ocupadas">
        <h3 class="section-title">
          Mesas Ocupadas
          <span class="material-symbols-outlined icon-arrow"
            >arrow_forward</span
          >
        </h3>
        <div class="occupied-scroll">
          <!-- Populated dynamically by JavaScript -->
          <p class="loading-text">Carregando...</p>
        </div>
      </section>

      <!-- Seção: Todas as Mesas -->
      <section class="tables-section" aria-label="Todas as mesas">
        <h3 class="section-title">
          Mesas
          <span class="material-symbols-outlined icon-arrow"
            >arrow_forward</span
          >
        </h3>
        <div class="tables-grid">
          <!-- Populated dynamically by JavaScript -->
          <p class="loading-text">Carregando...</p>
        </div>
      </section>
    </main>
  </body>
</html>
