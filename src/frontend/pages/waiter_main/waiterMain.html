<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Garçom</title>
  <link rel='icon' href='/img/icon.svg' type='image/svg+xml'>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Material Icons -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


</head>

<body>
  <header class="main-header">
    <div class="header-left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu de navegação">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="header-title">Dashboard</span>
    </div>

    <!-- Center: Logo -->
    <div class="header-center">
      <img src="../img/logoName.svg" alt="CatchOrder Logo" class="logo-image">
    </div>

    <!-- Right: Actions -->
    <nav class="header-actions">
      <button class="icon-btn-small" id="darkModeToggle" aria-label="Alternar modo escuro">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button class="icon-btn-small" id="userBtn" aria-label="Perfil do usuário">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
      <button class="icon-btn-small" id="logoutBtn" aria-label="Sair">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </nav>
  </header>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <button class="nav-item active" data-href="waiterMain.html">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="nav-text">Dashboard</span>
      </button>
      <button class="nav-item" data-href="orders.html">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="nav-text">Pedidos</span>
      </button>
    </nav>
  </aside>

  <main class="page-wrapper">
    <section class="summary-card">
      <div class="summary-left">
        <span class="badge-today">Visão Geral de Hoje</span>
        <p class="summary-date summary-title">Carregando data...</p>
        <h2 class="summary-value">R$ 0,00</h2>
        <p class="summary-subtitle">0 mesas atendidas hoje</p>
      </div>

      <div class="summary-right">
        <button class="btn btn-gold" id="newOrderBtn">
          Novo Pedido
        </button>

      </div>
    </section>



    <!-- Active Orders -->
    <section class="tables-section active-orders-section">
      <div class="section-header">
        <div class="title-group">
          <h3 class="section-title">Pedidos em Andamento</h3>
        </div>
      </div>
      <div class="active-orders-grid" id="activeOrdersGrid">
        <!-- Injected by TS -->
      </div>
    </section>

    <!-- Available Tables -->
    <section class="tables-section available-section" id="availableTablesSection">
      <div class="section-header">
        <div class="title-group">
          <h3 class="section-title">Mesas Disponíveis</h3>
        </div>

      </div>
      <div class="available-tables-grid">
        <!-- Injected by TS -->
      </div>
    </section>
  </main>



  <script src="waiterMain.js"></script>
</body>

</html>
