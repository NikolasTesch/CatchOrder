<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchOrder - Garçom</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <!-- Cabeçalho Principal -->
  <header class="main-header">
    <button class="icon-btn">
      <span class="material-symbols-outlined">menu</span>
    </button>

    <div class="header-center">
      <h1 class="page-title">CatchOrder</h1>
    </div>

    <div class="header-actions">
      <span class="status-indicator"></span>
      <span class="material-symbols-outlined profile-icon">account_circle</span>
    </div>
  </header>

  <div class="page-wrapper">
    <!-- Card de Resumo do Dia -->
    <div class="summary-card">
      <p class="summary-title">HOJE</p>
      <h2 class="summary-value">R$00,00</h2>
      <p class="summary-subtitle">x mesas atendidas hoje</p>
      <button class="btn-new-order">Novo Pedido</button>
    </div>

    <!-- Seção: Mesas Ocupadas -->
    <section class="tables-section">
      <h3 class="section-title">Mesas Ocupadas <span class="material-symbols-outlined icon-arrow">arrow_forward</span>
      </h3>
      <div class="occupied-scroll">
        <div class="table-card occupied">
          <span class="table-number">1</span>
        </div>
        <div class="table-card occupied">
          <span class="table-number">1</span>
        </div>
        <div class="table-card occupied">
          <span class="table-number">1</span>
        </div>
        <div class="table-card occupied">
          <span class="table-number">1</span>
        </div>
      </div>
    </section>

    <!-- Seção: Todas as Mesas -->
    <section class="tables-section">
      <h3 class="section-title">Mesas <span class="material-symbols-outlined icon-arrow">arrow_forward</span></h3>
      <div class="tables-grid">
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
        <div class="table-card available">
          <span class="table-number">1</span>
        </div>
      </div>
    </section>
  </div>
</body>

</html>
